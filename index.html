<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Desconto</title>

    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }

        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #0f172a, #164e63);

            color: white;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .container {

            background: #1e293b;

            width: 100%;

            max-width: 450px;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);

        }

        h1 {

            color: #67e8f9;

            text-align: center;

            margin-bottom: 15px;

        }

        .descricao {

            text-align: center;

            color: #cbd5e1;

            margin-bottom: 25px;

            line-height: 1.5;

        }

        label {

            display: block;

            margin-bottom: 10px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 2px solid #475569;

            border-radius: 10px;

            background: #0f172a;

            color: white;

            font-size: 18px;

        }

        input:focus {

            outline: 2px solid #67e8f9;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #67e8f9;

            color: #082f49;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background: #22d3ee;

        }

        .resultados {

            margin-top: 25px;

        }

        .resultado {

            display: flex;

            justify-content: space-between;

            gap: 12px;

            padding: 16px 0;

            border-bottom: 1px solid #475569;

        }

        .resultado span {

            color: #cbd5e1;

        }

        .resultado strong {

            text-align: right;

        }

        .desconto {

            color: #86efac;

        }

        .total {

            margin-top: 12px;

            padding: 18px 12px;

            border-radius: 10px;

            background: #164e63;

            border: none;

        }

        .total strong {

            color: #67e8f9;

            font-size: 20px;

        }

        .regras {

            background: #0f172a;

            padding: 15px;

            margin-top: 22px;

            border-radius: 10px;

            color: #cbd5e1;

            font-size: 13px;

            line-height: 1.8;

        }

        .regras h2 {

            color: white;

            font-size: 15px;

            margin-bottom: 5px;

        }

        #mensagem {

            color: #fca5a5;

            margin-top: 10px;

            font-size: 14px;

        }

    </style>

</head>

<body>

    <main class="container">

        <h1>Calculadora de Desconto</h1>

        <p class="descricao">

            Digite o valor da compra e descubra

            quanto vai economizar.

        </p>

        <form id="formulario">

            <label for="compra">Valor da compra (R$)</label>

            <input

                type="number"

                id="compra"

                placeholder="Ex.: 250.00"

                min="0"

                step="0.01"

                required

            >

            <button type="submit">

                Calcular desconto

            </button>

            <p id="mensagem" role="alert"></p>

        </form>

        <section class="resultados" aria-live="polite">

            <div class="resultado">

                <span>Valor da compra:</span>

                <strong id="valorCompra">R$ 0,00</strong>

            </div>

            <div class="resultado">

                <span>Valor do desconto:</span>

                <strong class="desconto" id="valorDesconto">

                    R$ 0,00

                </strong>

            </div>

            <div class="resultado total">

                <span>Compra com desconto:</span>

                <strong id="valorFinal">R$ 0,00</strong>

            </div>

        </section>

        <section class="regras">

            <h2>Regras de desconto</h2>

            <p>Até R$ 100,00: sem desconto.</p>

            <p>Acima de R$ 100,00: 5% de desconto.</p>

            <p>Acima de R$ 500,00: 10% de desconto.</p>

        </section>

    </main>

    <script>

        const formulario = document.getElementById("formulario");

        const campoCompra = document.getElementById("compra");

        const valorCompra = document.getElementById("valorCompra");

        const valorDesconto = document.getElementById("valorDesconto");

        const valorFinal = document.getElementById("valorFinal");

        const mensagem = document.getElementById("mensagem");

        function formatarMoeda(valor) {

            return valor.toLocaleString("pt-BR", {

                style: "currency",

                currency: "BRL"

            });

        }

        formulario.addEventListener("submit", function(event) {

            event.preventDefault();

            const entrada = campoCompra.value.trim();

            const compra = Number(entrada);

            if (

                entrada === "" ||

                !Number.isFinite(compra) ||

                compra < 0

            ) {

                mensagem.textContent =

                    "Digite um valor válido, maior ou igual a zero.";

                return;

            }

            mensagem.textContent = "";

            let percentual = 0;

            if (compra > 500) {

                percentual = 0.10;

            } else if (compra > 100) {

                percentual = 0.05;

            }

            const desconto = compra * percentual;

            const total = compra - desconto;

            valorCompra.textContent =

                formatarMoeda(compra);

            valorDesconto.textContent =

                formatarMoeda(desconto);

            valorFinal.textContent =

                formatarMoeda(total);

        });

    </script>

</body>

</html>
